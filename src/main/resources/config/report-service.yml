server:
  port: 8084

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/banking_reports

services:
  account:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
  credit:
    base-url: ${CREDIT_SERVICE_URL:http://localhost:8083}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bank.report: DEBUG
