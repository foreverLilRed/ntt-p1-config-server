server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - name: CircuitBreaker
          args:
            name: gatewayBreaker
            fallbackUri: forward:/fallback
      routes:
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**,/api/v1/catalogs/**
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/account-movements/**,/api/v1/transfers/**,/api/v1/account-analytics/**
        - id: credit-service
          uri: lb://credit-service
          predicates:
            - Path=/api/v1/credits/**,/api/v1/credit-cards/**,/api/v1/credit-movements/**,/api/v1/credit-card-movements/**,/api/v1/credit-analytics/**
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/reports/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: yanki-service
          uri: lb://yanki-service
          predicates:
            - Path=/api/v1/yanki/**
        - id: debit-cards
          uri: lb://account-service
          predicates:
            - Path=/api/v1/debit-cards/**

security:
  jwt:
    secret: ${JWT_SECRET:banking-p3-hs256-secret-key-32bytes-min}
    public-paths: /api/v1/auth/**,/actuator/**,/fallback

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
  circuitbreaker:
    instances:
      gatewayBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
