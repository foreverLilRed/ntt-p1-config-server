server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - name: CircuitBreaker
          args:
            name: gatewayBreaker
            fallbackUri: forward:/fallback
      routes:
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/account-movements/**,/api/v1/transfers/**,/api/v1/account-analytics/**
        - id: credit-service
          uri: lb://credit-service
          predicates:
            - Path=/api/v1/credits/**,/api/v1/credit-cards/**,/api/v1/credit-movements/**,/api/v1/credit-card-movements/**,/api/v1/credit-analytics/**
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/reports/**

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
  circuitbreaker:
    instances:
      gatewayBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
